spring.application.name=jobflow-tracker

# テストは開発用のデータファイルを汚さないよう、メモリ上の H2 を使う
spring.datasource.url=jdbc:h2:mem:jobflow-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# このファイルは main の application.properties の代わりに読まれるので、API の形に関わる設定は同じ値にする
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.default-leniency=false
logging.level.org.hibernate.orm.jdbc.error=ERROR
