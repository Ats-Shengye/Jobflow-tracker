spring.application.name=jobflow-tracker

# H2 をファイルに保存する（アプリを再起動してもデータが残る）。
# パスは起動したディレクトリからの相対なので、backend/ で起動すると backend/data/ にできる
spring.datasource.url=jdbc:h2:file:./data/jobflow
spring.datasource.username=sa
spring.datasource.password=

# ファイル保存の H2 は組み込み DB 扱いにならず、既定の ddl-auto が none になるため明示する
spring.jpa.hibernate.ddl-auto=update
# 画面は React で、サーバー側でビューを描画しないので切る
spring.jpa.open-in-view=false

# 既定では全てのネットワークで待ち受けるので、この PC からだけにする。スマホの実機で確かめる時だけ意図して開ける
server.address=127.0.0.1

# セッションの Cookie を JavaScript から読ませず、他のサイトからのリクエストでは送らせない
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# JSON のキーを API 仕様書の項目名（login_id など）に合わせる。テスト用の application.properties にも同じ行がある
spring.jackson.property-naming-strategy=SNAKE_CASE

# Jackson 3 の既定は、選択肢の番号（"status": 2 を INTERVIEW）、小数の切り捨て（面接回数 2.5 を 2）、
# 数値や時刻付きの日付（20261030 や 2026-10-30T10:00）を黙って読み替えるので、どれも 400 にする。テスト用にも同じ行がある
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.default-leniency=false

# 一意制約違反の時、Hibernate が DB のメッセージ（入力されたログイン ID を含む）を WARN で出すので止める。例外はそのまま上がる
logging.level.org.hibernate.orm.jdbc.error=ERROR
